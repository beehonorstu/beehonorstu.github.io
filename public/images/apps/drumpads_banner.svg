<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">DrumPads — Find your rhythm</title><desc id="desc">Cyan and lavender drum pads beside the DrumPads name. Play, record and create beats.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c2d"/><stop offset="1" stop-color="#1e304a"/></linearGradient></defs><rect width="1200" height="600" fill="url(#bg)"/><g fill="none" stroke="#6a8bb0" opacity=".1"><path d="M0 100h1200M0 200h1200M0 300h1200M0 400h1200M0 500h1200"/><path d="M100 0v600M200 0v600M300 0v600M400 0v600M500 0v600M600 0v600M700 0v600M800 0v600M900 0v600M1000 0v600M1100 0v600"/></g><g font-family="system-ui,sans-serif"><text x="80" y="170" fill="#5bd7fa" font-size="18" letter-spacing="4">BEHONOR STUDIO · ANDROID</text><text x="76" y="270" fill="#fff" font-size="76" font-weight="700">DrumPads</text><text x="80" y="327" fill="#c0d1e4" font-size="28">Find your rhythm.</text><text x="80" y="412" fill="#92a8c2" font-size="20">Play pads. Create beats. Record your ideas.</text><text x="80" y="460" fill="#5bd7fa" font-size="18">JAZZ ALWAYS FREE</text></g><g transform="translate(775 145)"><rect x="-20" y="-20" width="310" height="310" rx="40" fill="#0a1424" stroke="#3b526e" stroke-width="2"/><g fill="#39bdeb"><rect width="125" height="125" rx="16"/><rect x="145" width="125" height="125" rx="16"/><rect y="145" width="125" height="125" rx="16"/></g><rect x="145" y="145" width="125" height="125" rx="16" fill="#aaa4df"/><g fill="#fff" opacity=".2"><rect x="12" y="12" width="101" height="8" rx="4"/><rect x="157" y="12" width="101" height="8" rx="4"/><rect x="12" y="157" width="101" height="8" rx="4"/><rect x="157" y="157" width="101" height="8" rx="4"/></g></g></svg>