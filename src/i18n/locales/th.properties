about.mission=แอปอิสระเพื่อการสำรวจ สร้างสรรค์ และทำให้ชีวิตประจำวันง่ายขึ้น
about.story.title=ภารกิจของเรา
about.story.p1=BeHonor Studio คือสตูดิโอพัฒนาแอปอิสระ เรานำความอยากรู้อยากเห็นและปัญหาใกล้ตัวมาสร้างเป็นแอปที่ใช้ง่าย เชื่อถือได้ และใส่ใจรายละเอียด
about.story.p2=ISS Tracker ช่วยให้คุณติดตามสถานีอวกาศนานาชาติ Beat Expert เปิดโอกาสให้สร้างจังหวะดนตรี Charge Expert ช่วยให้เข้าใจแบตเตอรี่และการชาร์จ ส่วน Math Puzzle เปลี่ยนการคำนวณเป็นเกมฝึกตรรกะสนุก ๆ
about.story.p3=ทุกโปรเจกต์เริ่มจากแนวคิดที่ชัดเจน เราพัฒนา ทดสอบ และปรับปรุงฟีเจอร์ที่ใช้งานได้จริง โดยไม่เพิ่มความซับซ้อนเกินจำเป็น
