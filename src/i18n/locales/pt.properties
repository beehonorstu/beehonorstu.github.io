about.story.title=Nossa Missão
about.story.p1=O BeHonor Studio é um estúdio independente de aplicativos. Transformamos a curiosidade e as necessidades do cotidiano em ferramentas simples, bem cuidadas e agradáveis de usar.
about.story.p2=Com o ISS Tracker, você acompanha a Estação Espacial Internacional. O Beat Expert convida a criar batidas, o Charge Expert ajuda a entender a bateria e o carregamento, e o Math Puzzle transforma contas em desafios de lógica.
about.story.p3=Cada projeto começa com uma ideia clara. Criamos, testamos e aprimoramos o que realmente importa, sem complicação desnecessária.
