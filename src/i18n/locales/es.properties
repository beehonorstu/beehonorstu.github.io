about.story.title=Nuestra Misión
about.story.p1=BeHonor Studio es un estudio independiente de aplicaciones. Convertimos la curiosidad y las necesidades cotidianas en software sencillo y bien cuidado, con especial atención a la claridad y los pequeños detalles.
about.story.p2=Con ISS Tracker puedes seguir la Estación Espacial Internacional; Beat Expert te invita a crear ritmos; Charge Expert te ayuda a entender la batería y la carga; y Math Puzzle convierte las matemáticas en retos de lógica.
about.story.p3=Cada proyecto nace de una idea concreta. Lo desarrollamos, probamos y mejoramos poniendo por delante las funciones útiles, sin complicaciones innecesarias.
