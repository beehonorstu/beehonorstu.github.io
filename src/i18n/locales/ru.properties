about.title=Мы — <span class="text-primary">BeHonor Studio</span>
about.mission=Независимые приложения для открытий, творчества и повседневных задач.
about.story.title=Наша миссия
about.story.p1=BeHonor Studio — независимая студия приложений. Мы превращаем любопытство и реальные повседневные задачи в удобные инструменты, уделяя внимание ясному интерфейсу, стабильной работе и деталям.
about.story.p2=ISS Tracker помогает следить за Международной космической станцией, Beat Expert — создавать ритмы, Charge Expert — разбираться в состоянии батареи и зарядке, а Math Puzzle превращает вычисления в увлекательные логические задачи.
about.story.p3=Каждый проект начинается с простой идеи. Мы разрабатываем, проверяем и улучшаем действительно полезные функции, избегая ненужной сложности.
