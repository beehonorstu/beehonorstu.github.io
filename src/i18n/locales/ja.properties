about.mission=宇宙の探検から日常の便利さまで。好奇心を形にするインディーアプリ。
about.story.title=私たちのミッション
about.story.p1=BeHonor Studioは、好奇心や日々の「こんなアプリがあったら」を出発点に、使いやすさと細部にこだわって開発するインディーアプリスタジオです。
about.story.p2=ISS Trackerでは国際宇宙ステーションの動きを追跡でき、Beat Expertでは気軽にビートを制作できます。Charge Expertはバッテリーや充電の状態をわかりやすく伝え、Math Puzzleは計算を楽しい論理パズルに変えます。
about.story.p3=一つひとつのアプリに、はっきりした目的があります。必要な機能を丁寧に作り、試し、磨きながら、余計な複雑さを省いていきます。
