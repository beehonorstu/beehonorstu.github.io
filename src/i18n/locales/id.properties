about.mission=Aplikasi independen untuk menjelajah, berkarya, dan mempermudah keseharian.
about.story.title=Misi Kami
about.story.p1=BeHonor Studio adalah studio aplikasi independen. Berawal dari rasa ingin tahu dan kebutuhan sehari-hari, kami membuat aplikasi yang sederhana, andal, dan nyaman digunakan hingga ke detail kecilnya.
about.story.p2=ISS Tracker membantu Anda mengikuti Stasiun Luar Angkasa Internasional. Beat Expert mengajak Anda membuat irama, Charge Expert membantu memahami kondisi baterai dan pengisian daya, sedangkan Math Puzzle mengubah hitungan menjadi tantangan logika yang seru.
about.story.p3=Setiap proyek dimulai dari satu ide yang jelas. Kami membangun, menguji, dan menyempurnakan fitur yang benar-benar berguna, tanpa kerumitan yang tidak perlu.
