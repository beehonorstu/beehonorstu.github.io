about.title=우리는 <span class="text-primary">BeHonor Studio</span>입니다
about.mission=탐험과 창작, 일상의 편리함을 위한 인디 앱을 만듭니다.
about.story.title=우리의 미션
about.story.p1=BeHonor Studio는 일상의 필요와 호기심에서 아이디어를 얻는 독립 앱 스튜디오입니다. 쓰기 쉬운 구성, 안정적인 동작, 작은 디테일까지 신경 써서 앱을 만듭니다.
about.story.p2=ISS Tracker로 국제우주정거장의 움직임을 살펴보고, Beat Expert로 직접 비트를 만들 수 있습니다. Charge Expert는 배터리와 충전 상태를 이해하도록 돕고, Math Puzzle은 계산을 재미있는 논리 퍼즐로 바꿔 줍니다.
about.story.p3=모든 앱은 분명한 아이디어 하나에서 출발합니다. 꼭 필요한 기능을 만들고 테스트하고 다듬으며, 불필요한 복잡함은 덜어 냅니다.
