about.story.title=مهمتنا
about.story.p1=BeHonor Studio استوديو مستقل لتطوير التطبيقات. ننطلق من الفضول والاحتياجات اليومية لنصنع أدوات واضحة وسهلة الاستخدام، مع الاهتمام بالأداء والتفاصيل الصغيرة.
about.story.p2=يتيح لك ISS Tracker متابعة محطة الفضاء الدولية، ويساعدك Beat Expert على ابتكار الإيقاعات، ويمنحك Charge Expert فهمًا أفضل للبطارية والشحن، بينما يحوّل Math Puzzle الحساب إلى تحديات منطقية ممتعة.
about.story.p3=يبدأ كل مشروع بفكرة واضحة. نطوّر ما يفيد المستخدم فعلًا، ونختبره ونحسّنه باستمرار، من دون تعقيد غير ضروري.
