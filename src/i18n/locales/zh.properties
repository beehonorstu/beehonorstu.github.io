about.mission=以探索与创造为灵感，打造真正实用、好用的独立应用。
about.story.title=我们的使命
about.story.p1=BeHonor Studio 是一家独立应用工作室。我们从真实需求和好奇心出发，用清晰的设计、可靠的性能和用心打磨的细节，把想法做成值得日常使用的软件。
about.story.p2=ISS Tracker 带你追踪国际空间站；Beat Expert 让节奏创作触手可及；Charge Expert 帮你了解电池状态和充电过程；Math Puzzle 则让逻辑挑战更有趣。
about.story.p3=每款应用都始于一个明确的想法。我们不断开发、测试、改进，把精力留给真正有用的功能，而不是堆砌复杂设计。
