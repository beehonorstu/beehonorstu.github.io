about.mission=Niezależne aplikacje do odkrywania, tworzenia i codziennych zadań.
about.story.title=Nasza Misja
about.story.p1=BeHonor Studio to niezależne studio tworzące aplikacje. Łączymy ciekawość z codziennymi potrzebami, projektując proste i dopracowane narzędzia, które po prostu dobrze się obsługuje.
about.story.p2=ISS Tracker pozwala śledzić Międzynarodową Stację Kosmiczną, Beat Expert ułatwia tworzenie rytmów, Charge Expert pomaga zrozumieć stan baterii i ładowanie, a Math Puzzle zamienia liczenie w zabawę logiczną.
about.story.p3=Każdy projekt zaczyna się od jednego pomysłu. Tworzymy, testujemy i ulepszamy to, co naprawdę przydatne, bez zbędnych komplikacji.
