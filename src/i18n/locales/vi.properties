about.mission=Ứng dụng độc lập để khám phá, sáng tạo và giúp cuộc sống thuận tiện hơn.
about.story.title=Sứ mệnh của chúng tôi
about.story.p1=BeHonor Studio là một studio phát triển ứng dụng độc lập. Từ sự tò mò và những nhu cầu hằng ngày, chúng tôi tạo ra phần mềm gọn gàng, đáng tin cậy và được chăm chút trong từng chi tiết.
about.story.p2=ISS Tracker giúp bạn theo dõi Trạm Vũ trụ Quốc tế, Beat Expert giúp tự tay tạo nhịp điệu, Charge Expert giúp hiểu rõ pin và quá trình sạc, còn Math Puzzle biến phép tính thành thử thách tư duy thú vị.
about.story.p3=Mỗi ứng dụng bắt đầu từ một ý tưởng rõ ràng. Chúng tôi xây dựng, thử nghiệm và cải tiến những tính năng thực sự hữu ích, tránh các phức tạp không cần thiết.
