about.title=我們是 <span class="text-primary">BeHonor Studio</span>
about.mission=以探索與創作為靈感，打造真正實用、好用的獨立應用程式。
about.story.title=我們的使命
about.story.p1=BeHonor Studio 是一家獨立應用程式工作室。我們從真實需求與好奇心出發，透過清楚的設計、穩定的表現和細緻的打磨，讓每個想法成為日常用得上的工具。
about.story.p2=ISS Tracker 帶你追蹤國際太空站；Beat Expert 讓節奏創作更直覺；Charge Expert 幫助你掌握電池狀態與充電過程；Math Puzzle 則讓邏輯挑戰充滿樂趣。
about.story.p3=每款應用程式都從一個明確的想法開始。我們持續開發、測試、改進，專注真正有用的功能，不增加不必要的複雜度。
