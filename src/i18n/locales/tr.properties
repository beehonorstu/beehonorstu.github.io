about.mission=Keşfetmek, üretmek ve günlük hayatı kolaylaştırmak için bağımsız uygulamalar.
about.story.title=Misyonumuz
about.story.p1=BeHonor Studio bağımsız bir uygulama stüdyosudur. Merakımızdan ve günlük ihtiyaçlardan yola çıkarak sade, güvenilir ve ayrıntıları özenle düşünülmüş uygulamalar geliştiriyoruz.
about.story.p2=ISS Tracker ile Uluslararası Uzay İstasyonu'nu takip edebilir, Beat Expert ile ritimler oluşturabilirsiniz. Charge Expert pilinizi ve şarj sürecini anlamanıza yardımcı olur; Math Puzzle ise matematiği keyifli mantık bulmacalarına dönüştürür.
about.story.p3=Her proje net bir fikirle başlar. Gerçekten işe yarayan özellikleri geliştirir, test eder ve iyileştiririz; gereksiz karmaşadan kaçınırız.
